name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install homeassistant pytest-homeassistant-custom-component ruff mypy pytest-cov
      - name: Ruff lint
        run: ruff check custom_components tests
      - name: Ruff format check
        run: ruff format --check custom_components tests
      - name: Mypy (strict)
        run: mypy custom_components/alexa_shopping_categoriser
      - name: Pytest with coverage
        run: |
          pytest tests/ \
            --cov=custom_components.alexa_shopping_categoriser \
            --cov-report=term-missing \
            --cov-fail-under=90
      - name: Categoriser 100% coverage gate
        run: |
          pytest tests/test_categoriser.py \
            --cov=custom_components.alexa_shopping_categoriser.categoriser \
            --cov-report=term-missing \
            --cov-fail-under=100

  frontend:
    name: Card (test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/alexa-shopping-categoriser-card
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build bundle
        run: npm run build
